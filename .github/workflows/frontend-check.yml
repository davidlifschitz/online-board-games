name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check auth-landing.js
          node --check build.js
          node --check community-voting.js
          node --check leaderboard.js
          node --check play.js
          node --check site.js
          node --check sw.js
          node --check tests/production-smoke.mjs
          node --check games/gameplay-ui.js
          node --check games/v2-ui.js
          node --check games/v2-bridge.js
          node --check games/crown-jump/engine.js
          node --check games/crown-jump/ai.js
          node --check games/crown-jump/ai-worker.js
          node --check games/crown-jump/persistence.js
          node --check games/crown-jump/app.js
          node --check games/gridwake/engine.js
          node --check games/gridwake/game.js
          node --check games/gridwake/sw.js
          node --check games/high-table/engine.js
          node --check games/high-table/game.js
          node --check games/hearts/engine.js
          node --check games/hearts/game.js
          node --check games/spades/engine.js
          node --check games/spades/game.js
          node --check games/gin-rummy/engine.js
          node --check games/gin-rummy/game.js
          node --check games/rummy-500/engine.js
          node --check games/rummy-500/game.js
          node --check games/photo-puzzle/game.js
          node --check games/photo-puzzle/mobile.js
          node --check games/fourfront/v2/game.js
          node --check games/five-dice/v2/game.js
          node --check games/huebreak/v2/game.js
          node --check games/threadmark/v2/game.js
          node --check games/frontiers/v2/game.js
      - name: Validate TrainGames manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(m.name!=='TrainGames'||m.start_url!=='/play.html')process.exit(1)"
      - name: Test PWA icon contract
        run: node tests/pwa-icon-contract.test.js
      - name: Test Gridwake deployment contract
        run: node tests/gridwake-placement-contract.test.js
      - name: Test Gridwake engine
        run: node games/gridwake/tests/engine.test.js
      - name: Test catalog publication contract
        run: node --test tests/catalog-publication.test.js
      - name: Test Batch 3 cache invalidation
        run: node --test tests/batch3-cache-version.test.js
      - name: Test photo puzzle mobile UX
        run: node --test tests/photo-puzzle-mobile.test.js
      - name: Test gameplay UI coverage and offline contract
        run: node --test tests/gameplay-ui-contract.test.js
      - name: Test V2 external engines
        run: node --test tests/v2-external-engines.test.js
      - name: Test TrainGames V2 redesign contract
        run: node --test tests/gameplay-v2-contract.test.js
      - name: Test Transit Network product UI contract
        run: node --test tests/transit-network-ui.test.js
      - name: Test Batch 3 card engines
        run: |
          node games/high-table/tests/engine.test.js
          node games/hearts/tests/engine.test.js
          node games/spades/tests/engine.test.js
          node games/gin-rummy/tests/engine.test.js
          node games/rummy-500/tests/engine.test.js
      - name: Test Crown Jump engine and repetition behavior
        run: npm test --prefix games/crown-jump
