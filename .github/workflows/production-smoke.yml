name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production UI, assets, OAuth handoffs, and voting privacy
        id: smoke
        env:
          SITE_URL: https://os-online-board-games.vercel.app
          SUPABASE_URL: https://slnvfdkyvijrhmisurhw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_zUTHu9mHMbPfNKIgM_O0Zg_INCN9yF6
        run: |
          node <<'NODE'
          const site = process.env.SITE_URL;
          const supabase = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;

          const requireOk = async (url) => {
            const response = await fetch(url, { redirect: 'follow' });
            if (!response.ok) throw new Error(`${url} returned ${response.status}`);
            return response;
          };

          const root = await requireOk(site);
          const html = await root.text();
          for (const marker of ['BUILDER BOARD', 'SUBMIT AN IMPLEMENTATION', 'Continue with GitHub', 'Continue with Google']) {
            if (!html.includes(marker)) throw new Error(`Production HTML missing: ${marker}`);
          }

          for (const path of ['/games.json', '/styles.css', '/app.js', '/community-voting.js']) {
            await requireOk(`${site}${path}`);
          }

          const votingModule = await (await requireOk(`${site}/community-voting.js`)).text();
          for (const marker of ['COMMUNITY FAVORITES', 'build_votes', 'vote_count']) {
            if (!votingModule.includes(marker)) throw new Error(`Voting module missing: ${marker}`);
          }

          const approvedResponse = await fetch(`${supabase}/rest/v1/builder_submissions?select=id,vote_count&status=eq.approved&order=vote_count.desc&limit=100`, {
            headers: { apikey: key },
          });
          if (!approvedResponse.ok) throw new Error(`Public voting aggregate returned ${approvedResponse.status}`);
          const approvedBuilds = await approvedResponse.json();
          if (!Array.isArray(approvedBuilds) || approvedBuilds.length < 1) {
            throw new Error('Public voting aggregate returned no approved builds');
          }
          for (const build of approvedBuilds) {
            if (!Number.isInteger(build.vote_count) || build.vote_count < 0) {
              throw new Error(`Invalid public vote_count for ${build.id}`);
            }
          }

          const privateVotesResponse = await fetch(`${supabase}/rest/v1/build_votes?select=submission_id&limit=1`, {
            headers: { apikey: key },
          });
          if (privateVotesResponse.ok) {
            throw new Error('Anonymous client unexpectedly received direct build_votes access');
          }

          const settingsResponse = await fetch(`${supabase}/auth/v1/settings`, {
            headers: { apikey: key },
          });
          if (!settingsResponse.ok) throw new Error(`Auth settings returned ${settingsResponse.status}`);
          const settings = await settingsResponse.json();
          if (!settings.external?.github) throw new Error('GitHub Auth is not enabled in Supabase');
          if (!settings.external?.google) throw new Error('Google Auth is not enabled in Supabase');

          const expectedHosts = {
            github: new Set(['github.com']),
            google: new Set(['accounts.google.com']),
          };

          for (const provider of ['github', 'google']) {
            const authorize = new URL(`${supabase}/auth/v1/authorize`);
            authorize.searchParams.set('provider', provider);
            authorize.searchParams.set('redirect_to', site);
            const response = await fetch(authorize, {
              headers: { apikey: key },
              redirect: 'manual',
            });
            if (![301, 302, 303, 307, 308].includes(response.status)) {
              const body = await response.text();
              throw new Error(`${provider} authorize returned ${response.status}: ${body.slice(0, 300)}`);
            }
            const location = response.headers.get('location');
            if (!location) throw new Error(`${provider} authorize did not return a Location header`);
            const host = new URL(location).hostname;
            if (!expectedHosts[provider].has(host)) {
              throw new Error(`${provider} authorize redirected to unexpected host ${host}`);
            }
          }

          console.log('Production UI/assets, voting aggregates/privacy, GitHub/Google Auth, and OAuth handoffs OK.');
          NODE

      - name: Report requested verification to issue 13
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-production-smoke]') }}
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const passed = process.env.SMOKE_OUTCOME === 'success';
            const icon = passed ? '✅' : '❌';
            const summary = passed
              ? 'Production smoke passed: live Builder Board and Community Favorites assets returned successfully, voting aggregates were public while individual vote rows stayed private, Supabase reports GitHub and Google enabled, and both OAuth initiation endpoints redirected to the expected provider hosts.'
              : 'Production smoke failed. Inspect the workflow run for the failing production, voting privacy, Supabase settings, or OAuth handoff check.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13,
              body: `${icon} ${summary}\n\nCommit: \`${context.sha}\``
            });
