<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Crown Jump — Open Checkers</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">OPEN CHECKERS</p><h1>Crown Jump</h1><p class="subtitle">American draughts with local AI that adapts to repeated positions.</p></div><button id="newGame" class="ghost">New game</button></header><section class="toolbar card"><label>Mode<select id="mode"><option value="ai">Vs computer</option><option value="local">Local two-player</option><option value="online">Online room</option></select></label><label id="difficultyWrap">AI<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><label id="thinkWrap">Thinking time<select id="thinkTime"><option value="250">0.25 s</option><option value="700">0.7 s</option><option value="1500">1.5 s</option><option value="3000">3 s</option></select></label><label>First player<select id="firstPlayer"><option value="red" selected>Red</option><option value="black">Black</option></select></label></section><section class="game-grid"><div class="board-wrap card"><div class="status-row"><div><span id="turnDot" class="turn-dot red"></span><strong id="statusText">Red to move</strong></div><div id="thinking" class="thinking hidden">AI thinking</div></div><div id="board" class="board" aria-label="Checkers board"></div><p id="hint" class="hint">Tap a piece to see legal moves.</p></div><aside class="side-stack"><section id="onlinePanel" class="card panel hidden"><h2>Online room</h2><p class="muted">Peer-to-peer rooms. The host is Red.</p><div class="row"><input id="roomCode" placeholder="ROOM CODE" maxlength="10"><button id="joinRoom">Join</button></div><button id="hostRoom" class="wide">Create room</button><div id="onlineStatus" class="mini-status">Not connected</div></section><section class="card panel"><div class="panel-title"><h2>Captured</h2><span id="score"></span></div><div class="captured-line"><span>Red</span><div id="capturedRed" class="captured"></div></div><div class="captured-line"><span>Black</span><div id="capturedBlack" class="captured"></div></div></section><section class="card panel history-panel"><div class="panel-title"><h2>Move history</h2><button id="copyState" class="text-btn">Export</button></div><ol id="history"></ol><textarea id="stateBox" class="state-box hidden" placeholder="Paste exported state here"></textarea><button id="importState" class="ghost wide">Import correspondence state</button></section></aside></section></main><dialog id="gameOverDialog"><div class="dialog-card"><p class="eyebrow">GAME OVER</p><h2 id="gameOverTitle">Red wins</h2><p id="gameOverReason"></p><div class="row"><button id="closeDialog" class="ghost">Review board</button><button id="playAgain">Play again</button></div></div></dialog><script type="module" src="./app.js"></script></body></html>
