<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b18"><title>Deal Room • OS Board Games</title><style>
:root{font:15px system-ui;color-scheme:dark;--bg:#09110f;--panel:#131f1b;--line:#2e443b;--text:#eef3ef;--muted:#9aaba3;--accent:#e2c46f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203a31,#09110f 48%);color:var(--text)}button,input,select{font:inherit}.shell{width:min(1280px,96vw);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:20px}.mark{background:var(--accent);color:#1d1a10;border-radius:8px;padding:5px 8px}.pill{font-size:11px;color:#b8c8c0;border:1px solid #3b5048;border-radius:999px;padding:5px 8px}.hero{padding:42px 0}.hero h1{font-size:60px;line-height:.93;letter-spacing:-.06em;margin:6px 0 14px}.lede{color:var(--muted);max-width:720px;line-height:1.5}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.mode,.btn{background:#17251f;color:var(--text);border:1px solid #365046;border-radius:13px;padding:13px;text-align:left}.mode:hover,.btn:hover{border-color:#78917f}.mode b{display:block;font-size:18px}.mode span{display:block;color:var(--muted);margin-top:5px;font-size:12px}.primary{background:var(--accent);color:#1b190f;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:130px;background:#101b17;border:1px solid #354b42;border-radius:10px;color:var(--text);padding:11px}.gamehead{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.gamehead h2{margin:0}.sub{color:var(--muted);font-size:12px}.board{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}.table,.side{background:#111d18;border:1px solid var(--line);border-radius:16px;padding:13px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}.player{border:1px solid #30463d;border-radius:12px;padding:10px}.player.on{border-color:#d0bb73}.meta{font-size:11px;color:var(--muted)}.your{margin-top:12px;border-top:1px solid #2e4039;padding-top:12px}.sets{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.set{display:inline-flex;gap:4px;align-items:center;font-size:11px;border:1px solid #3a5148;border-radius:999px;padding:4px 7px}.dot{width:10px;height:10px;border-radius:3px;background:var(--c)}.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 3px;min-height:220px}.card{width:138px;min-width:138px;height:196px;border:1px solid #46564f;background:#e8e4d6;color:#171814;border-radius:14px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 14px #0005}.band{height:12px;border-radius:8px;background:var(--c)}.cardname{font-weight:900;font-size:17px;margin-top:10px}.kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase}.value{font-weight:900}.card button{border:1px solid #908a75;background:#fff8dd;color:#1e1b12;border-radius:8px;padding:5px;margin-top:4px}.card button:first-child{background:#25291e;color:#fff}.side h3{font-size:11px;letter-spacing:.14em;color:#afc2b7}.log{display:grid;gap:6px;max-height:390px;overflow:auto}.log div{font-size:11px;color:#a8b6af;border-left:2px solid #43574d;padding-left:7px}.winner{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.winner>div{background:#17231e;border:1px solid #53685e;border-radius:18px;padding:28px;min-width:300px;text-align:center}.source{font-size:11px;color:#8fa198;margin-top:18px}.source a{color:#d8c27d}@media(max-width:800px){.modes{grid-template-columns:1fr}.board{grid-template-columns:1fr}.hero h1{font-size:48px}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const app=document.querySelector('#app'),SUITS={copper:{label:'Copper',size:2,rents:[1,2],color:'#936143'},sky:{label:'Sky',size:3,rents:[1,2,3],color:'#77bddd'},rose:{label:'Rose',size:3,rents:[1,2,4],color:'#c56c96'},ember:{label:'Ember',size:3,rents:[1,3,5],color:'#d77738'},ruby:{label:'Ruby',size:3,rents:[2,3,6],color:'#c64b49'},gold:{label:'Gold',size:3,rents:[2,4,6],color:'#d4b84c'},grove:{label:'Grove',size:3,rents:[2,4,7],color:'#5b9865'},indigo:{label:'Indigo',size:2,rents:[3,8],color:'#4665a7'},station:{label:'Station',size:4,rents:[1,2,3,4],color:'#6f7c78'},service:{label:'Service',size:2,rents:[1,2],color:'#8d7caf'}},PV={copper:1,sky:1,rose:2,ember:2,ruby:3,gold:3,grove:4,indigo:4,station:2,service:2};let seq=1,state=null,screen='home',me='human',peer=null,conn=null,conns=new Map(),peerMap=new Map(),lobby=null;const id=()=>`c${seq++}`,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function money(v){return{id:id(),kind:'money',name:`${v} Credit`,value:v}}function prop(s){return{id:id(),kind:'property',name:`${SUITS[s].label} Asset`,value:PV[s],suit:s}}function flex(){return{id:id(),kind:'wild',name:'Flexible Asset',value:2,suit:null}}function act(type,name,v=1){return{id:id(),kind:'action',type,name,value:v}}function deck(){seq=1;let d=[];for(const[v,n]of[[1,6],[2,5],[3,3],[4,3],[5,2],[10,1]])for(let i=0;i<n;i++)d.push(money(v));for(const[s,m]of Object.entries(SUITS))for(let i=0;i<m.size;i++)d.push(prop(s));for(let i=0;i<8;i++)d.push(flex());for(let i=0;i<10;i++)d.push(act('refill','Refill',1));for(let i=0;i<12;i++)d.push(act('invoice','Invoice',1));for(let i=0;i<3;i++)d.push(act('collection','Collection Day',2));for(let i=0;i<3;i++)d.push(act('demand','Demand Payment',3));for(let i=0;i<3;i++)d.push(act('snatch','Snatch',3));for(let i=0;i<3;i++)d.push(act('trade','Trade Order',3));for(let i=0;i<2;i++)d.push(act('takeover','Hostile Takeover',5));for(let i=0;i<2;i++)d.push(act('multiplier','Multiplier',1));return d}function shuffle(a){a=a.map(x=>({...x}));for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function player(x){return{id:x.id,name:x.name,bot:!!x.bot,hand:[],bank:[],props:[]}}function draw(p,n){for(let i=0;i<n;i++){if(!state.deck.length){state.deck=shuffle(state.discard);state.discard=[]}let c=state.deck.pop();if(c)p.hand.push(c)}}function current(){return state.players[state.current]}function count(p,s){return p.props.filter(c=>c.suit===s).length}function full(p,s){return count(p,s)>=SUITS[s].size}function sets(p){return Object.keys(SUITS).filter(s=>full(p,s)).length}function begin(){let p=current();draw(p,p.hand.length?2:5);state.actions=3;state.mult=1;state.log.push(`${p.name} drew cards.`)}function create(ps){state={v:2,deck:shuffle(deck()),discard:[],players:ps.map(player),current:0,actions:3,turn:1,mult:1,winner:null,log:[]};state.players.forEach(p=>draw(p,5));begin()}function requireTurn(pid){if(state.winner)throw Error('Game over');if(current().id!==pid)throw Error('Not your turn');if(state.actions<=0)throw Error('No actions left')}function take(p,cid){let i=p.hand.findIndex(c=>c.id===cid);if(i<0)throw Error('Card not in hand');return p.hand.splice(i,1)[0]}function win(p){if(sets(p)>=3){state.winner=p.id;state.log.push(`${p.name} completed three portfolios.`)}}function playProperty(pid,cid,suit){requireTurn(pid);let p=state.players.find(x=>x.id===pid),c=take(p,cid);if(!['property','wild'].includes(c.kind))throw Error('Not an asset');if(c.kind==='wild'){if(!SUITS[suit])throw Error('Choose a suit');c.suit=suit}p.props.push(c);state.actions--;state.log.push(`${p.name} placed ${SUITS[c.suit].label}.`);win(p)}function bank(pid,cid){requireTurn(pid);let p=state.players.find(x=>x.id===pid),c=p.hand.find(x=>x.id===cid);if(['property','wild'].includes(c.kind))throw Error('Assets cannot be banked');p.bank.push(take(p,cid));state.actions--;state.log.push(`${p.name} banked ${c.value}.`)}function assets(p){return[...p.bank,...p.props].reduce((n,c)=>n+c.value,0)}function pay(from,to,amt){amt=Math.min(amt,assets(from));let pool=[...from.bank.map(c=>['bank',c]),...from.props.map(c=>['props',c])].sort((a,b)=>a[1].value-b[1].value),paid=0;while(pool.length&&paid<amt){let[z,c]=pool.shift(),i=from[z].findIndex(x=>x.id===c.id);if(i<0)continue;from[z].splice(i,1);to[z==='props'?'props':'bank'].push(c);paid+=c.value}state.log.push(`${from.name} paid ${to.name} ${paid}.`);win(to)}function loose(p){return p.props.filter(c=>!full(p,c.suit))}function target(pid){return state.players.filter(p=>p.id!==pid).sort((a,b)=>assets(b)-assets(a))[0]}function playAction(pid,cid,opt={}){requireTurn(pid);let p=state.players.find(x=>x.id===pid),c=p.hand.find(x=>x.id===cid);if(c.kind!=='action')throw Error('Not an action');let t=opt.target&&state.players.find(x=>x.id===opt.target)||target(pid);if(c.type==='multiplier'){take(p,cid);state.discard.push(c);state.mult=2;state.actions--;return}take(p,cid);state.discard.push(c);state.actions--;if(c.type==='refill'){draw(p,2);state.log.push(`${p.name} refilled two.`)}else if(c.type==='collection'){state.players.filter(x=>x!==p).forEach(x=>pay(x,p,2));state.log.push(`${p.name} ran Collection Day.`)}else if(c.type==='demand'){if(t)pay(t,p,5)}else if(c.type==='invoice'){let s=opt.suit||Object.keys(SUITS).filter(s=>count(p,s)).sort((a,b)=>SUITS[b].rents[Math.min(count(p,b),SUITS[b].size)-1]-SUITS[a].rents[Math.min(count(p,a),SUITS[a].size)-1])[0];if(!s)throw Error('Need an asset to invoice');let r=SUITS[s].rents[Math.min(count(p,s),SUITS[s].size)-1]*state.mult;state.mult=1;state.players.filter(x=>x!==p).forEach(x=>pay(x,p,r));state.log.push(`${p.name} invoiced ${r}.`)}else if(c.type==='snatch'){let x=loose(t)[0];if(!x)throw Error('No loose asset');t.props=t.props.filter(q=>q.id!==x.id);p.props.push(x);state.log.push(`${p.name} snatched an asset.`);win(p)}else if(c.type==='trade'){let a=loose(p)[0],b=loose(t)[0];if(!a||!b)throw Error('Both sides need loose assets');p.props=p.props.filter(x=>x.id!==a.id);t.props=t.props.filter(x=>x.id!==b.id);p.props.push(b);t.props.push(a);state.log.push(`${p.name} forced a trade.`);win(p);win(t)}else if(c.type==='takeover'){let s=t&&Object.keys(SUITS).find(s=>full(t,s));if(!s)throw Error('No complete portfolio to acquire');let xs=t.props.filter(x=>x.suit===s);t.props=t.props.filter(x=>x.suit!==s);p.props.push(...xs);state.log.push(`${p.name} completed a takeover.`);win(p)}}function end(pid){if(current().id!==pid)return;let p=current();while(p.hand.length>7)state.discard.push(p.hand.pop());state.current=(state.current+1)%state.players.length;state.turn++;begin()}function botTurn(p){let guard=0;while(current()===p&&!state.winner&&guard++<8){if(state.actions<=0){end(p.id);break}let pr=p.hand.find(c=>c.kind==='property'||c.kind==='wild');if(pr){let s=pr.suit||Object.keys(SUITS).sort((a,b)=>count(p,b)/SUITS[b].size-count(p,a)/SUITS[a].size)[0];playProperty(p.id,pr.id,s);continue}let a=p.hand.find(c=>c.kind==='action'&&c.type==='takeover'&&Object.keys(SUITS).some(s=>full(target(p.id),s)))||p.hand.find(c=>c.kind==='action'&&['invoice','refill','demand','collection','snatch'].includes(c.type));if(a){try{playAction(p.id,a.id)}catch{bank(p.id,a.id)}continue}let b=p.hand.filter(c=>c.kind!=='property'&&c.kind!=='wild').sort((x,y)=>y.value-x.value)[0];if(b){bank(p.id,b.id);continue}end(p.id)}}function suitPick(){let n=prompt('Choose asset group:\n'+Object.keys(SUITS).map((s,i)=>`${i+1}. ${SUITS[s].label}`).join('\n'),'1');return Object.keys(SUITS)[Number(n)-1]}function actionFor(c){if(c.kind==='money')return{type:'bank',id:c.id};if(c.kind==='property')return{type:'prop',id:c.id,suit:c.suit};if(c.kind==='wild')return{type:'prop',id:c.id,suit:suitPick()};if(c.kind==='action')return{type:'action',id:c.id}}function command(cmd,pid=me){if(!cmd)return;if(conn&&!isHost()){conn.send({type:'cmd',cmd,pid});return}applyCmd(cmd,pid);sync()}function applyCmd(c,pid){try{if(c.type==='bank')bank(pid,c.id);else if(c.type==='prop')playProperty(pid,c.id,c.suit);else if(c.type==='action')playAction(pid,c.id,c.opt);else if(c.type==='end')end(pid);render();runBots()}catch(e){alert(e.message)}}function runBots(){if(!state||state.winner)return;let p=current();if(p.bot)setTimeout(()=>{botTurn(p);sync();render();runBots()},250)}function sync(){if(peer&&isHost())for(const c of conns.values())if(c.open)c.send({type:'state',state,lobby})}function isHost(){return lobby?.hostId===me}function roomCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}function ensurePeer(cb){if(window.Peer)return cb();let s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';s.onload=cb;s.onerror=()=>alert('Online service failed to load');document.head.append(s)}function host(){ensurePeer(()=>{let code=roomCode();me='host';lobby={code,hostId:me,players:[{id:me,name:'Host'}]};peer=new Peer('dealroom-v2-'+code.toLowerCase());peer.on('open',()=>{screen='lobby';render()});peer.on('connection',c=>{c.on('data',d=>{if(d.type==='join'){let p={id:d.p.id,name:d.p.name||'Player'};lobby.players.push(p);conns.set(c.peer,c);peerMap.set(c.peer,p.id);sync();render()}else if(d.type==='cmd'){let pid=peerMap.get(c.peer);if(pid===d.pid){applyCmd(d.cmd,pid);sync()}}})})})}function join(){let code=(document.querySelector('#room')?.value||'').trim().toUpperCase(),name=(document.querySelector('#name')?.value||'Player').trim();if(!code)return;ensurePeer(()=>{me='g'+Math.random().toString(36).slice(2,7);peer=new Peer();peer.on('open',()=>{conn=peer.connect('dealroom-v2-'+code.toLowerCase(),{reliable:true});conn.on('open',()=>conn.send({type:'join',p:{id:me,name}}));conn.on('data',d=>{if(d.type==='state'){state=d.state;lobby=d.lobby;screen=state?'game':'lobby';render()}})})})}function startSolo(){me='human';lobby=null;create([{id:me,name:'You'},{id:'bot',name:'DealBot',bot:true}]);screen='game';render();runBots()}function addBot(){lobby.players.push({id:'bot'+lobby.players.length,name:'Bot '+lobby.players.length,bot:true});sync();render()}function startLobby(){create(lobby.players);screen='game';sync();render();runBots()}function setsHtml(p){let a=Object.keys(SUITS).filter(s=>count(p,s));return a.map(s=>`<span class="set"><i class="dot" style="--c:${SUITS[s].color}"></i>${SUITS[s].label} ${count(p,s)}/${SUITS[s].size}${full(p,s)?' ✓':''}</span>`).join('')||'<span class="meta">No assets</span>'}function cardHtml(c,can){let color=c.suit?SUITS[c.suit].color:c.kind==='action'?'#d2ad4e':c.kind==='money'?'#69a57b':'#7768a8';return`<div class="card" style="--c:${color}"><div><div class="band"></div><div class="kind">${c.kind}</div><div class="cardname">${esc(c.name)}</div></div><div><span class="value">${c.value}</span>${can?`<button data-id="${c.id}" data-play>Play</button>${c.kind==='action'||c.kind==='money'?`<button data-id="${c.id}" data-bank>Bank</button>`:''}`:''}</div></div>`}function layout(x){return`<main class="shell"><header class="top"><div class="brand"><b class="mark">DR</b> Deal Room</div><span class="pill">MIT-aligned · original deck</span></header>${x}</main>`}function home(){app.innerHTML=layout(`<section class="hero"><div class="ey">OPEN-SOURCE PROPERTY-SET CARD GAME</div><h1>Build portfolios.<br>Break deals.</h1><p class="lede">A fast browser card game aligned to the permissively licensed DealBench state model while keeping original names, artwork and presentation.</p><div class="modes"><button class="mode" id="solo"><b>Vs computer</b><span>Two-player game with a tactical bot.</span></button><button class="mode" id="host"><b>Host online</b><span>Create a peer-to-peer room.</span></button><button class="mode" id="join"><b>Join room</b><span>Enter a code from a friend.</span></button></div><div class="row" id="joinbox" hidden><input id="name" value="Player" aria-label="Name"><input id="room" placeholder="ROOM" aria-label="Room code"><button class="btn primary" id="joinnow">Join</button></div><p class="source">Each turn: draw, play up to three cards, bank credits/actions, and complete three different portfolios. <a href="./THIRD_PARTY_NOTICES.md">Source lineage</a>.</p></section>`);document.querySelector('#solo').onclick=startSolo;document.querySelector('#host').onclick=host;document.querySelector('#join').onclick=()=>document.querySelector('#joinbox').hidden=false;document.querySelector('#joinnow').onclick=join}function lobbyView(){app.innerHTML=layout(`<section class="hero"><div class="ey">ONLINE ROOM</div><h1>${lobby.code}</h1><p class="lede">Share this code. The host browser stays authoritative.</p><div class="players">${lobby.players.map(p=>`<div class="player"><b>${esc(p.name)}</b><div class="meta">${p.bot?'Computer':'Human'}</div></div>`).join('')}</div>${isHost()?`<div class="row"><button class="btn" id="add">Add bot</button><button class="btn primary" id="start">Start game</button></div>`:'<p class="meta">Waiting for host…</p>'}</section>`);document.querySelector('#add')?.addEventListener('click',addBot);document.querySelector('#start')?.addEventListener('click',startLobby)}function gameView(){let p=state.players.find(x=>x.id===me)||state.players[0],act=current(),can=act.id===me&&!state.winner;app.innerHTML=layout(`<div class="gamehead"><div><h2>${esc(act.name)} to play</h2><div class="sub">Turn ${state.turn} · ${state.actions} actions left · ${state.deck.length} cards in draw pile</div></div><button class="btn" id="quit">New game</button></div><section class="board"><div class="table"><div class="players">${state.players.filter(x=>x.id!==p.id).map(x=>`<div class="player ${x===act?'on':''}"><b>${esc(x.name)}</b><div class="meta">${x.hand.length} cards · ${x.bank.reduce((n,c)=>n+c.value,0)} bank · ${sets(x)}/3 portfolios</div><div class="sets">${setsHtml(x)}</div></div>`).join('')}</div><div class="your"><b>${esc(p.name)}</b><div class="meta">${p.bank.reduce((n,c)=>n+c.value,0)} bank · ${sets(p)}/3 portfolios</div><div class="sets">${setsHtml(p)}</div><div class="hand">${p.hand.map(c=>cardHtml(c,can&&state.actions>0)).join('')}</div><div class="row"><button class="btn primary" id="end" ${can?'':'disabled'}>End turn</button></div></div></div><aside class="side"><h3>HOW TO WIN</h3><p class="meta">Complete three different portfolios. Flexible Assets can join any group.</p><h3>ACTIVITY</h3><div class="log">${state.log.slice(-26).reverse().map(x=>`<div>${esc(x)}</div>`).join('')}</div><p class="source"><a href="./THIRD_PARTY_NOTICES.md">MIT upstream notice</a></p></aside></section>${state.winner?`<div class="winner"><div><div class="ey">GAME OVER</div><h2>${esc(state.players.find(x=>x.id===state.winner)?.name)} wins</h2><button class="btn primary" id="again">Play again</button></div></div>`:''}`);document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{let c=p.hand.find(x=>x.id===b.dataset.id);command(actionFor(c))});document.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>command({type:'bank',id:b.dataset.id}));document.querySelector('#end').onclick=()=>command({type:'end'});document.querySelector('#quit').onclick=()=>{peer?.destroy?.();peer=conn=null;conns.clear();state=null;screen='home';render()};document.querySelector('#again')?.addEventListener('click',()=>{state=null;screen='home';render()})}function render(){if(screen==='home')home();else if(screen==='lobby')lobbyView();else gameView()}render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
